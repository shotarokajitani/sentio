name: deploy
on:
  push:
    branches: [main]

# 同時デプロイを防止
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # CIと同じ検証を再実行（mainへの直pushやsquash mergeでCIをスキップした場合の安全弁）
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint
      # integration は Supabase 起動が要るため ci.yml の integration ジョブが担う。
      # ここで走らせると SUPABASE_* 不在で rls.test.ts のガードが fail する
      - run: pnpm exec vitest run --exclude 'tests/e2e/**' --exclude 'tests/integration/**'
      # `check:allowlist` はここでは走らせない（2026-08-20・案A）。
      #
      # 実DBの列照会（psql 直結）に変わったため Supabase の起動が要る。このジョブには
      # 無いので `SUPABASE_DB_URL` 未設定 → `scripts/live-schema.ts:27` が throw →
      # `check-allowlist.ts` が reason: "query-failed" で fail-closed の exit 1 になり、
      # verify が必ず落ちて `needs: verify` の deploy-migrations に到達しない。
      # 担当は ci.yml の integration ジョブ（`ci.yml:48` の「integration ジョブへ移した」
      # という宣言と対応する。移設したのに deploy.yml だけが取り残されていた）。
      #
      # **この分担は main への直 push が禁止されていることに依存する。**
      # `ci.yml:2` は `on: [pull_request]` のみで、直 push では走らない。
      # PR 経由（squash merge を含む）なら ci.yml が走るので穴は無いが、
      # 直 push が可能な状態では S2 allowlist の機械的担保がその経路だけ消える
      # （CLAUDE.md 絶対規則「S2テーブルに本文型カラムを追加しない」）。
      # 設定手順は docs/runbooks/2026-08-20_branch-protection.md。
      # ブランチ保護が外れた場合はこの分担を見直すこと。

  # スキーマを先に反映する。関数が先に出ると「新コードが未適用の関数/カラムを呼ぶ」不整合が起きる
  # （実例: 00017 未適用のまま sync-connections がデプロイ済みになった 2026-08-12 の事故）
  deploy-migrations:
    runs-on: ubuntu-latest
    needs: verify
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # version: latest はCLIの破壊的変更をそのまま踏む
      # （`supabase db push --project-ref` 廃止で deploy #31559757735 が失敗した型）
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # supabase db push は --project-ref を受け付けない。link してから --linked で押す
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # 本番履歴に残る孤児バージョン2件を「未適用」に戻す。
      # 出所はアーカイブ済み旧プロジェクト（archive/legacy の 20260414_*.sql）で、
      # ローカルに対応ファイルが無いため db push が
      # `Remote migration versions not found in local migrations directory.` で中断する
      # （deploy #31576330545 / #31824237712 で実測）。
      #
      # 対象2バージョンをハードコードする。将来の別ドリフトは従来どおり失敗として顕在化させたい
      # （網羅的なrepairにすると、意図しない履歴の食い違いを黙って飲み込んでしまう）。
      #
      # 冪等性: repair --status reverted は schema_migrations からの DELETE 相当で、
      # 対象行が既に無い場合も成功する。2回目以降の実行は no-op。
      - name: Repair migration history (旧プロジェクト由来の孤児2件)
        run: supabase migration repair --status reverted 20260414183617 20260414183945 --linked

      - name: Apply migrations
        run: supabase db push --linked

  deploy-functions:
    runs-on: ubuntu-latest
    needs: [verify, deploy-migrations]
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      # version: latest はCLIの破壊的変更をそのまま踏む
      # （`supabase db push --project-ref` 廃止で deploy #31559757735 が失敗した型）
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # 削除の段と本番突合が `pnpm exec tsx` を使う（発注 F）。
      # **一覧をワークフローに直書きしない**ため、宣言を読む口が要る
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # function ごとに個別step。`if: !cancelled()` で1件の失敗が後続を止めないようにしつつ、
      # 失敗したstepはそのままジョブ失敗として顕在化させる（|| true / continue-on-error は禁止）
      #
      # `--no-verify-jwt` は付けない（契約 S-4）。
      # 2026-08-19 の本番実測で、認証情報ゼロでも不正な Bearer でも
      # `state-memory-packet` が HTTP 200 と実データを返したため、17本すべてから外した。
      #
      # **ただし「案B＋A の二層」にはなっていない。実際は一層である。**
      # 2026-08-27 の本番実測: **ゲートウェイは JWT を検証していない。**
      # ヘッダ無し / でたらめな Bearer / 署名が不正な JWT の3通りとも、
      # 返ってきたのは Supabase 自身のエラーではなく `caller.ts` の
      # `unauthorized()` の本文（`{"error":"unauthorized"}`）だった。
      # **不正な JWT でもユーザーワーカーまで届いている。**
      # つまりこのフラグを外したことは、実効的に何も足していない。
      # 実測の全文: `docs/reports/2026-08-27_service_role_key形式の実測.md`
      #
      # 現に守っているのは内側の `resolveCaller`（S-2-9）**だけ**である。
      # 漏洩はしていない（fail-closed で 401 を返している）が、片方が壊れたときの余地が無い。
      # **一層で確定**（2026-08-29・`docs/adr/0002-auth-boundary.md`）。
      # `resolveCaller` を唯一の認証境界と宣言し、追加の層は置かない。
      # 保証は `check:caller-guard`（全 Function が `resolveCaller` を通ることを CI で機械検査）。
      #
      # **401 に当たったからといってこのフラグを戻さないこと。** 戻すなら契約側から。
      - name: Deploy sync-connections
        if: ${{ !cancelled() }}
        run: supabase functions deploy sync-connections --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy scan
        if: ${{ !cancelled() }}
        run: supabase functions deploy scan --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy investigate
        if: ${{ !cancelled() }}
        run: supabase functions deploy investigate --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy run-sense
        if: ${{ !cancelled() }}
        run: supabase functions deploy run-sense --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-calendar
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-calendar --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-csv
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-csv --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-s0
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-s0 --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-monitor
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-monitor --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-baselines
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-baselines --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-summary
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-summary --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-narratives
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-narratives --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-memory-packet
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-memory-packet --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy deliver-alert
        if: ${{ !cancelled() }}
        run: supabase functions deploy deliver-alert --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy deliver-pulse
        if: ${{ !cancelled() }}
        run: supabase functions deploy deliver-pulse --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy deliver-weekly
        if: ${{ !cancelled() }}
        run: supabase functions deploy deliver-weekly --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy day0
        if: ${{ !cancelled() }}
        run: supabase functions deploy day0 --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy onetap-calendar
        if: ${{ !cancelled() }}
        run: supabase functions deploy onetap-calendar --project-ref "$SUPABASE_PROJECT_REF"

      # 保持期間を過ぎたイベントを消す定期処理（プライバシーポリシー §6）。
      # cron 登録は A-2（本スライスの後）。それまでは Actions の invoke-function から手動で回す
      - name: Deploy retention-purge
        if: ${{ !cancelled() }}
        run: supabase functions deploy retention-purge --project-ref "$SUPABASE_PROJECT_REF"

      # 配信ディスパッチャ（契約 slice-cron-dispatch.md）。cron はこの2本だけを叩く
      - name: Deploy dispatch-daily
        if: ${{ !cancelled() }}
        run: supabase functions deploy dispatch-daily --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy dispatch-weekly
        if: ${{ !cancelled() }}
        run: supabase functions deploy dispatch-weekly --project-ref "$SUPABASE_PROJECT_REF"

      # ------------------------------------------------------------------
      # 旧関数の削除（発注 F）
      #
      # **本番に、リポジトリのどこにも無い関数が20本 ACTIVE で残っていた**
      # （2026-09-10 の実測）。4月に作られたもので、`entrypoint_path` が
      # `/tmp/user_fn_…` になっているのが目印である。
      #
      # `deploy.yml` は「配る」しかしていなかったので、配っていない関数が
      # 本番に残っていても誰も見なかった。残っていたものには
      # `stripe-webhook` / `create-checkout` / `create-portal-link` /
      # `process-answer` が含まれる——**課金と入力の口が、誰も見ていない実装で
      # 開いたままだった。**
      #
      # 消す一覧は `docs/checklists/edge-functions.yml` の `remove`。
      # **存在しない slug は成功扱い**にする（冪等）。再実行のたびに赤くなると、
      # この段そのものが「いつも赤いから見ない」ものになる。
      # ------------------------------------------------------------------
      - name: "旧関数を消す（宣言どおり。存在しない slug は成功扱い）"
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          slugs=$(pnpm exec tsx scripts/check-edge-functions.ts --list-remove)
          echo "消す対象: $slugs"
          failed=0
          for slug in $slugs; do
            out=$(supabase functions delete "$slug" --project-ref "$SUPABASE_PROJECT_REF" 2>&1) && {
              echo "削除: $slug"
              continue
            }
            # **「そもそも無い」は成功。** それ以外は失敗として顕在化させる
            if printf '%s' "$out" | grep -qiE "not found|does not exist"; then
              echo "既に無い: $slug"
            else
              echo "::error::$slug の削除に失敗: $out"
              failed=1
            fi
          done
          exit $failed

      # 本番の一覧と宣言を突き合わせる。**「知らないものが居る」を検出する**のが目的で、
      # 消し忘れではなく**新たに増えた残骸**を捕まえる（今回の20本と同じ形の再発）
      - name: "check:edge-functions — 本番に知らない関数が居ないことを確かめる"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          live=$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF" -o json             | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).map(f=>f.slug).join(' ')))")
          echo "本番に居る関数: $live"
          SUPABASE_FUNCTIONS_LIVE="$live" pnpm run check:edge-functions
