# アカウント削除の対象宣言（check:deletion-coverage の正本）
#
# ## 原則
#
# **`company_id` を持つテーブルは、全件が DELETE の既定対象である。**
# プライバシーポリシー §6 は「当該アカウントに紐づくすべてのデータ
# （Google ユーザーデータ、認証情報、生成された分析結果を含む）を削除します」と
# **公開済み**であり、消し残しはそのまま約束違反になる。
#
# したがってこの宣言に「消すもの」は書かない。**書くのは例外だけである。**
# 残すものがある場合は `keep` に挙げ、**「残す理由」**を書く。
# 「消す理由」は書かない。既定が削除だからである。
#
# ## なぜ検査器が要るか
#
# 削除は当面 `docs/runbooks/2026-08-20_account-deletion.md` の手作業である。
# 手順書の DELETE 列挙は人が書いた台帳なので、**テーブルが増えたときに
# 追記を忘れると、消し残しが静かに残る。**
#
# `07_open_items.md`「アカウント削除APIの実装」は 2026-08-20 の登録時点で
# この形を「3 が一番危ない」と予告していた。**2026-09-03 に現物が出た** —
# `known_explanations` が列挙から漏れており、`company_id` を持つ11件に対して
# 手順書の DELETE は10件だった。
#
# ## 守れない範囲（設計上の限界。これは仕様であって不具合ではない）
#
# **この検査器が見るのは「`company_id` を持つテーブル」だけである。**
# `company_id` を持たない経路で会社に紐づくデータは見ない。たとえば
#
#   - 中間テーブル経由でしか会社に辿れない行
#   - 別のテーブルの id を外部キーに持つだけの行
#   - `auth.users.user_metadata` の中身（購読情報・自社サイトURLなど）
#   - Vault の秘密（手順書の「3. Vault のトークンを破棄する」で別に扱う）
#   - Storage のオブジェクト、外部サービス（Stripe / Resend）に残る記録
#
# これらは**この検査では捕まらない。** 射程が違うのであって、不具合ではない。
# `.claude/rules/hooks-coverage.md` / `ci-coverage.md` / `cron-jobs.yml` と同じ作法で、
# 黙って残った穴を「守られている」と誤読させないためにここへ書く。
#
# もう1つ。**この検査器は「手順書に書いてあるか」しか見ない。**
# 手順書のとおりに人が実行したかは見ていない。実行の担保は手順書の
# 「5. 消えたことを確認する」と「8. 記録する」にある。
#
# ## フィールド
#
#   runbook  DELETE 列挙を読む手順書のパス
#   keep     既定（＝削除）から外すテーブルと、**残す理由**

runbook: docs/runbooks/2026-08-20_account-deletion.md

# 例外は現時点で0件。
#
# **何を残すかは未判断である**（`docs/spec/07_open_items.md`
# 「アカウント削除APIの実装」の未判断リスト）。課金・会計の保存義務がある記録が
# 該当しうるが、**どの範囲かは決まっていない。** 決まるまでは例外を置かない
# ——置かない方が、消し残しではなく「消しすぎ」の側に倒れるからである。
keep: []
