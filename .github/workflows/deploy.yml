name: deploy
on:
  push:
    branches: [main]

# 同時デプロイを防止
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # CIと同じ検証を再実行（mainへの直pushやsquash mergeでCIをスキップした場合の安全弁）
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint
      - run: pnpm test
      - run: pnpm run check:allowlist

  # スキーマを先に反映する。関数が先に出ると「新コードが未適用の関数/カラムを呼ぶ」不整合が起きる
  # （実例: 00017 未適用のまま sync-connections がデプロイ済みになった 2026-08-12 の事故）
  deploy-migrations:
    runs-on: ubuntu-latest
    needs: verify
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # supabase db push は --project-ref を受け付けない。link してから --linked で押す
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: supabase db push --linked

  deploy-functions:
    runs-on: ubuntu-latest
    needs: [verify, deploy-migrations]
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # function ごとに個別step。`if: !cancelled()` で1件の失敗が後続を止めないようにしつつ、
      # 失敗したstepはそのままジョブ失敗として顕在化させる（|| true / continue-on-error は禁止）
      - name: Deploy sync-connections
        if: ${{ !cancelled() }}
        run: supabase functions deploy sync-connections --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy scan
        if: ${{ !cancelled() }}
        run: supabase functions deploy scan --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy investigate
        if: ${{ !cancelled() }}
        run: supabase functions deploy investigate --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy run-sense
        if: ${{ !cancelled() }}
        run: supabase functions deploy run-sense --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-calendar
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-calendar --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-csv
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-csv --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-s0
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-s0 --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ingest-monitor
        if: ${{ !cancelled() }}
        run: supabase functions deploy ingest-monitor --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-baselines
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-baselines --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-summary
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-summary --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-narratives
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-narratives --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy state-memory-packet
        if: ${{ !cancelled() }}
        run: supabase functions deploy state-memory-packet --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy deliver-alert
        if: ${{ !cancelled() }}
        run: supabase functions deploy deliver-alert --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy deliver-pulse
        if: ${{ !cancelled() }}
        run: supabase functions deploy deliver-pulse --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy deliver-weekly
        if: ${{ !cancelled() }}
        run: supabase functions deploy deliver-weekly --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy day0
        if: ${{ !cancelled() }}
        run: supabase functions deploy day0 --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy onetap-calendar
        if: ${{ !cancelled() }}
        run: supabase functions deploy onetap-calendar --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
