# public スキーマの表に、`anon` / `authenticated` が何を持ってよいかの宣言
# （`check:table-grants` の正本。発注 ①-1.5）
#
# ## なぜ宣言ファイルが要るか
#
# 00036 が同じ形で失敗している。**本文には「読むだけにする」と書き、
# `GRANT SELECT` も書いてあるのに、`REVOKE ALL` の相手が `anon` だけだった。**
# `connector_limits` と `known_explanations` は元の書き込み権限を保ったまま残り、
# 自表検証（4-1）の一覧にもこの2表が入っていなかったので、migration は緑で通った。
#
# **一覧を人が2か所（migration の本文と、検証の配列）に書き写す形にすると必ずずれる。**
# ここを1か所の正本にして、migration の配列も検査器もここから突き合わせる。
#
# ## 分類
#
# read_only  … `authenticated` は SELECT だけ。書き込みは service_role が持つ
# writable   … `authenticated` の SELECT/INSERT/UPDATE/DELETE を残す表。
#              **それでも TRUNCATE / REFERENCES / TRIGGER は渡さない**
#              （2026-09-13 の点検・PR-2b で0表になった）
# no_access  … `authenticated` にも `anon` にも1つも渡さない表。
#              RLS 有効・ポリシー無しで、service_role だけが読み書きする
#
# `TRUNCATE` を全表で外すのは、**RLS を素通しするから**である。
# `connections` の DELETE は RLS のポリシーで自社の行に絞られるが、
# `TRUNCATE connections` にはポリシーが一切掛からない。全社の行が消える。
#
# `REFERENCES` は他人の表に外部キーを張れる権限、`TRIGGER` は他人の表に
# トリガを仕掛けられる権限で、どちらも顧客が持つ理由が無い。
#
# ## anon
#
# **1つも持たせない。** 未ログインに会社のデータの用は無い（00036 で落とし済み）。

# `authenticated` が SELECT だけを持つ表
read_only:
  - baselines
  - budget_usage
  - company_summary
  - connections # PR-2b（00050）で writable から移した
  - connector_limits # 00036 の実装漏れ。全社共通の枠を顧客が書き換えられてよい理由が無い
  - delivery_log
  - entities # PR-2b（00050）で writable から移した
  - events # PR-2b（00050）で writable から移した
  - findings
  - known_explanations # 00036 の実装漏れ。共有行（company_id IS NULL）を持つ表である
  - misjudgments
  - narratives

# `authenticated` の書き込みを残す表。**ここは「漏れ」ではなく明示的な許可である。**
#
# 2026-09-13 の点検・PR-2b（00050）で **0表になった。** それまでは
# events / entities / connections の3表がここにあった。Next の Route Handler が
# 利用者のクライアント（`ANON_KEY` ＋ セッション）でこの3表を書いていたためである。
#
#   events        src/app/api/csv/ingest              取り込んだ明細の upsert
#   events        src/app/api/connections/disconnect  解除時の delete
#   entities      src/app/api/competitors/suggest     競合候補の insert
#   connections   src/app/api/connections/disconnect  解除時の delete
#
# PR-2a（#126）でこの4経路を service_role に寄せ、本番で確かめてから外した
# （順序を逆にすると、本番の CSV 取り込みと連携の解除がその場で止まる）。
#
# **ここに表を足すときは、利用者が API を通さず PostgREST を直に叩いて
# 自社の行を書き換えられてよいか**を先に決めること。RLS は行を絞るだけで、
# 自社の行の書き換えは止めない。
writable: []

# `writable` の表で `authenticated` に**残す**権限。検査器はこの一覧を
# 「持っていなければならないもの」として突き合わせる（欠けたら missing で赤くなる）
writable_privileges:
  - SELECT
  - INSERT
  - UPDATE
  - DELETE

# `authenticated` にも `anon` にも、1つも権限を渡さない表（2026-09-13 の点検・PR-2b で追加）。
#
# いずれも RLS 有効・ポリシー無しで、service_role だけが読み書きする。
# **ポリシーが無いので、GRANT が残っていても行は見えない。** それでも GRANT を持たせないのは、
# ポリシーを1本足した瞬間に読める・書ける形を作らないためである（`connector_limits` の件と同じ）。
#
#   api_rate_limits             00049 レート制限の回数。利用者が触れると自分の件数を0に戻せる
#   billing_webhook_events      00028 課金 webhook の処理済み記録
#   billing_webhook_unresolved  00029 会社を引けなかった課金 webhook
#   connection_events           00032 連携の状態の遷移
#   dispatch_runs               00032 配信の実行記録
#   retention_purge_runs        00030 削除の実行記録
#
# **`connection_events` は 00036 で SELECT を渡していたが、00050 で外した**（#127 の検収で決定）。
# 「画面から読む予定はある」という理由だったが、読む画面は0件で、ポリシーが無いので0行しか返らない。
# **読む画面を作る PR で、GRANT SELECT と RLS ポリシーを一緒に足す**（ここから read_only に移す）。
no_access:
  - api_rate_limits
  - billing_webhook_events
  - billing_webhook_unresolved
  - connection_events
  - dispatch_runs
  - retention_purge_runs

# どの表でも `authenticated` に渡さない権限
never_granted:
  - TRUNCATE
  - REFERENCES
  - TRIGGER
