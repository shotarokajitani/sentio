name: ci
on: [pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3 # F4: 秘密の混入検査
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # 送信事故の防止（契約 S-2-10）。CI に Resend の設定を持ち込んでいないことを
      # テストより先に事実として確かめる。ローカルでは vitest.config.ts が
      # `.env` 由来の値を落とすが、CI 側は「そもそも渡していない」ことを実測で示す。
      - name: "Resend の設定が CI に載っていないことを確かめる"
        run: |
          set -uo pipefail
          fail=0
          for k in RESEND_API_KEY RESEND_FROM; do
            v=$(printenv "$k" || true)
            if [ -n "$v" ]; then
              echo "::error::$k が CI 環境に載っている。deliver 系のテストが実送信しうる"
              fail=1
            else
              echo "$k: 未設定"
            fi
          done
          exit $fail

      - run: pnpm typecheck && pnpm lint
      # integration は Supabase 起動が要るため専用ジョブ（integration）で実行する。
      # ここで走らせると SUPABASE_* 不在で rls.test.ts のガードが fail するため明示除外する。
      # 除外を外したい場合は integration ジョブ側の env 注入も併せて見直すこと。
      - run: pnpm exec vitest run --exclude 'tests/e2e/**' --exclude 'tests/integration/**'

      # 実DBの要らない静的検査。壊れた書き方をマージ前に止める。
      # check:allowlist は実DB照会になったため integration ジョブへ移した（契約 S-5-4）。
      # ここに残すと Supabase 不在で必ず落ちる。
      - run: pnpm run check:db-errors # S-2-4: DBエラーの握りつぶし検出
      - run: pnpm run check:caller-guard # S-4-8: 越境封鎖の適用漏れ検出
      # S-5-7: 検査器の配置ずれ検出。「検査器はあるが CI で落ちない」を止める。
      # 実DBを要求しない静的解析なので、Docker が落ちた日にこの検査ごと消えることはない。
      # 宣言の正本は docs/checklists/ci-coverage.yml（自分自身も宣言に入っている）。
      - run: pnpm run check:ci-coverage

      - run: pnpm run eval:engine -- --ci # prompts/ 変更時はエンジン評価を必須実行

  # RLS等の統合テストを skip なしで実行する。
  # 「env が無いから skip」で緑になる状態（fail-open）を構造的に作らないためのジョブ。
  integration:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # version: latest はCLIの破壊的変更をそのまま踏む（deploy #31559757735）。固定する
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: supabase start

      # 全 migration が素通しで適用されることの証跡。
      # ローカルのDocker不可環境ではここが唯一の全適用検証になる。
      #
      # **ステップ名に範囲を書かない。** 以前は "(00001..00019)" と書いていたが、
      # 実際には 00024 まであった（2026-08-20 に検収者が指摘）。
      # supabase db reset は supabase/migrations/ 配下を全件適用するので動作は正しく、
      # ずれていたのは宣言のほうだった。番号を人が書き写す形にすると必ずずれるので、
      # 範囲は書かずに**実測をログへ出す**。
      - name: Apply all migrations from scratch
        run: |
          set -euo pipefail
          files=(supabase/migrations/*.sql)
          echo "適用対象 ${#files[@]}件: $(basename "${files[0]}") 〜 $(basename "${files[-1]}")"
          supabase db reset

      - name: Export Supabase env
        run: |
          set -euo pipefail
          status=$(supabase status -o env)
          get() { printf '%s\n' "$status" | grep "^$1=" | cut -d= -f2- | tr -d '"'; }
          API_URL=$(get API_URL)
          ANON=$(get ANON_KEY)
          SRK=$(get SERVICE_ROLE_KEY)
          # DB_URL は check:allowlist / check:schema が実DBの列を引くのに使う。
          # PostgREST は information_schema を公開しないため、psql で直接つなぐ
          # （scripts/live-schema.ts の冒頭に理由を記載）
          DB_URL=$(get DB_URL)
          # ローカル開発用の固定値だが、鍵をログに残さない原則を守る
          echo "::add-mask::$ANON"
          echo "::add-mask::$SRK"
          echo "::add-mask::$DB_URL"
          test -n "$API_URL" && test -n "$ANON" && test -n "$SRK" && test -n "$DB_URL"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SRK" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "接続先: $API_URL"
          echo "psql: $(psql --version 2>&1 || echo '見つからない')"

      # 実DBに当たる検査。ここに置くのは Supabase が起きているのがこのジョブだけのため。
      - name: "check:allowlist — S2 allowlist を実DBの列と突合する"
        if: ${{ !cancelled() }}
        run: pnpm run check:allowlist

      - name: "check:schema — Edge Function の参照列を実DBと突合する"
        if: ${{ !cancelled() }}
        run: pnpm run check:schema

      # Edge Function に実HTTPで到達できるかを、テストより先に事実として記録する（契約 S-5-2）。
      # `supabase start` が Edge Runtime を含むかはCLIのバージョンに依存するため、
      # 「動いているはず」で進めずここで実測する。
      #
      # **scan 1本ではなく全 Function を叩く**（2026-08-21 の 503 フレーク対処・案B）。
      # 実測は `docs/reports/2026-08-21_CI_503フレークの実測.md`。
      # 落ちるテストが試行ごとに移動し、観測値は毎回 503 だった。scan 1本のプローブは
      # 通っていたので、「Edge Runtime に到達できるか」は見えていたが
      # 「個々の Function が応答できる状態か」は見えていなかった。
      #
      # `supabase/config.toml` は `[edge_runtime] policy = "oneshot"` なので、
      # ワーカー自体はリクエストごとに作り直される。**ここで温めているのはワーカーではなく、
      # コンテナ内の Deno モジュールキャッシュである**（各 Function の依存グラフの初回解決）。
      # これが 503 の機序だという確証は無い（実測できるのは CI の色だけ）。
      # 効いていなければ同じ 503 が再発するので、その時点で案を組み直す。
      #
      # プローブは POST ではなく **OPTIONS** を投げる。18本すべてが CORS 分岐を
      # ハンドラ先頭に持ち（`req.method === "OPTIONS"` → 200 "ok"）、
      # 認証にもDBにも触れずに戻る。POST だと service_role として本物の処理が走り、
      # この後の integration テストが見るDBの状態を、プローブが先に動かしてしまう。
      # Authorization は付ける。ゲートウェイの verify_jwt を通してユーザーワーカーまで届かせるため。
      - name: Probe Edge Runtime reachability (全 Function)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail

          # **本数を人が書き写さない。** 実物のディレクトリを数える
          # （`_shared` は Function ではなく共有モジュールなので除く）。
          # 番号や本数をワークフローに書くと必ずずれる（Apply all migrations と同じ理由）。
          fns=()
          for d in supabase/functions/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            [ "$n" = "_shared" ] && continue
            fns+=("$n")
          done
          if [ "${#fns[@]}" -eq 0 ]; then
            echo "::error::supabase/functions/ に Function が1本も無い。列挙の仕方が壊れている"
            exit 1
          fi
          echo "対象 ${#fns[@]}本: ${fns[*]}"

          # 【一時・陰性コントロール2】ログ回収後に revert する。恒久的な変更ではない。
          # 待ち受けていないポートへ向け、curl 失敗で code=000 と判定されて
          # その場で exit 1 することを CI 上で実測する。
          # これは `$(curl ... || echo "000")` が `000000` になり到達不能の判定が
          # 一度も成立しなかったバグ（d73ffe1 で修正済み）の、CI 上での証明にあたる。
          SUPABASE_URL="http://127.0.0.1:1"
          echo "【陰性コントロール2】向き先を $SUPABASE_URL に変えた（待ち受けなし）"

          MAX_ATTEMPTS=30   # 1本あたりの試行上限
          SLEEP_SEC=2       # 503 を踏んだときの待ち
          BUDGET_SEC=420    # 全体の総待ち時間の上限

          start=$SECONDS
          waited=0          # 起動待ちが発生した Function の本数
          retries=0         # 503 を踏んだ総回数

          for fn in "${fns[@]}"; do
            attempt=0
            fn_start=$SECONDS
            while :; do
              attempt=$((attempt + 1))
              # 前の試行の本文を持ち越さない。curl が接続に失敗した回は -o を書かないため、
              # 消しておかないと無関係な応答本文をエラーに添えてしまう
              : > /tmp/probe.txt
              # **`$(curl ... || echo "000")` と書かない。** curl は失敗時にも
              # `%{http_code}` として `000` を出すので `||` の分と連結して `000000` になり、
              # 到達不能の判定が一度も成立しない（2026-08-23 に実測。従来のプローブも同じ形だった）。
              # 終了ステータスは代入とは別に見る
              if ! code=$(curl -s -o /tmp/probe.txt -w '%{http_code}' -X OPTIONS \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                "$SUPABASE_URL/functions/v1/$fn"); then
                code="000"
              fi

              # 到達不能は起動待ちではない。待っても直らないので即落とす
              if [ "$code" = "000" ]; then
                echo "::error::$fn: Edge Runtime に到達できない（curl 失敗）。supabase start が functions を配信していない"
                exit 1
              fi

              if [ "$code" = "200" ]; then
                el=$((SECONDS - fn_start))
                if [ "$attempt" -gt 1 ]; then
                  waited=$((waited + 1))
                  echo "$fn: 200（起動待ちあり — ${attempt}回目 / ${el}秒）"
                else
                  echo "$fn: 200（${el}秒）"
                fi
                break
              fi

              # 200 でも 503 でもない応答は「起動待ち」では説明できない。
              # 握りつぶすとプローブが何も温めていないのに緑になるので、ここで落とす
              if [ "$code" != "503" ]; then
                echo "::error::$fn: OPTIONS に $code を返した。起動待ち（503）でも到達不能（000）でもない"
                echo "応答本文:"; cat /tmp/probe.txt || true
                exit 1
              fi

              retries=$((retries + 1))

              # **上限を超えたら必ず赤にする。** 503 を待ち続けて緑にしない
              if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                echo "::error::$fn: 503 が ${MAX_ATTEMPTS}回続いた（${SLEEP_SEC}秒間隔 / $((SECONDS - fn_start))秒）。起動待ちの上限を超えた"
                echo "応答本文:"; cat /tmp/probe.txt || true
                exit 1
              fi
              if [ "$((SECONDS - start))" -ge "$BUDGET_SEC" ]; then
                echo "::error::全 Function の起動待ちが合計 ${BUDGET_SEC}秒を超えた（$fn の ${attempt}回目で打ち切り）"
                echo "応答本文:"; cat /tmp/probe.txt || true
                exit 1
              fi
              sleep "$SLEEP_SEC"
            done
          done

          # 「起動待ちがあった事実」を残す。0本でも「0本だった」と言わせる
          echo "起動完了: ${#fns[@]}本 / $((SECONDS - start))秒 / 起動待ちが発生した Function ${waited}本 / 503 を踏んだ総回数 ${retries}回"

      # 3回連続で同じ結果になることを確認する（RLSは状態依存の誤検知が出やすい）
      - name: Run integration suite 3 times
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "===== integration run $i/3 — 接続先 $SUPABASE_URL ====="
            pnpm exec vitest run tests/integration/ --reporter=verbose 2>&1 | tee "/tmp/it-$i.log"
          done

      # 「env が無いから skip で緑」を作らないための可視化（契約 S-5-5）。
      # skip の件数と対象を必ずログに出す。0件でも「0件だった」と言わせる。
      - name: Report skipped tests
        if: ${{ always() }}
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            [ -f "/tmp/it-$i.log" ] || continue
            echo "===== run $i の skip ====="
            grep -E '(↓|skipped)' "/tmp/it-$i.log" || echo "skip 0件"
          done

      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop

  # Edge Function の型検査。tsconfig が各 Function の index.ts を除外しているため、
  # index.ts に型検査が掛かるのは**このジョブだけ**である
  # （2026-08-19: typecheck / lint / unit が全部緑の状態で deno check が28件で落ちた）。
  #
  # コマンドをここに書き写さず `pnpm run check:edge-types` を呼ぶ。
  # 同じ内容を CI とローカルの2箇所に持つと、片方だけ更新されたときに
  # 「検査対象から漏れているのに緑」が起きる（check:allowlist が1行 log で
  # 緑を返していたのと同型の空洞）。実体は scripts/check-edge-types.ts の1本だけ。
  # 対象網羅のアサーションも同じスクリプトに入っている。
  edge-functions:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Supabase Edge Runtime と同系メジャー（Deno 2系）に固定する。
      # scripts/check-edge-types.ts の REQUIRED_DENO_VERSION と同じ値にすること
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - run: pnpm run check:edge-types
# 本番反映はmainマージ後の別workflow（deploy.yml, スライス1で作成）のみ。手動デプロイ禁止。
